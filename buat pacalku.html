<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebuah Surat Untukmu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #2b0f1e 0%, #14070e 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Partikel Cahaya Romantis */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .sparkle {
            position: absolute;
            background: radial-gradient(circle, #ffd1dc 0%, rgba(255, 182, 193, 0) 70%);
            border-radius: 50%;
            animation: floatSparkle 10s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Layar Pembuka (Amplop) */
        .envelope-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #361224 0%, #12060c 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        .envelope-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .wax-seal {
            position: relative;
            z-index: 10000;
            width: 96px;
            height: 96px;
            background: radial-gradient(circle at 30% 30%, #e63956, #8f1126);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.6rem;
            box-shadow: 0 0 30px rgba(230, 57, 86, 0.6), inset 0 0 10px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: pulseHeart 2s infinite;
            margin-bottom: 25px;
            border: 3px solid #f4a2b1;
            user-select: none;
        }

        .wax-seal:hover {
            transform: scale(1.1);
        }

        .wax-seal:active {
            transform: scale(0.95);
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        .envelope-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #ffccd5;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 105, 135, 0.4);
            user-select: none;
        }

        .envelope-sub {
            font-size: 0.9rem;
            color: #d8a7b1;
            letter-spacing: 1.5px;
            user-select: none;
        }

        /* Tombol Musik Pojok Kanan Atas */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 192, 203, 0.3);
            color: #ffccd5;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 50;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .music-btn:hover {
            background: rgba(255, 105, 135, 0.3);
        }

        /* Kartu Surat Utama */
        .card-container {
            width: 92%;
            max-width: 440px;
            background: rgba(35, 14, 25, 0.75);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 32px 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 117, 143, 0.15);
            text-align: center;
            z-index: 10;
            border: 1px solid rgba(255, 182, 193, 0.25);
            position: relative;
        }

        .slide {
            display: none;
            animation: slideFade 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .slide.active {
            display: block;
        }

        @keyframes slideFade {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Gaya Bingkai Polaroid */
        .polaroid {
            background: #fff9fa;
            padding: 12px 12px 28px 12px;
            border-radius: 6px;
            width: 230px;
            margin: 0 auto 22px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
            transform: rotate(-2deg);
            transition: transform 0.4s ease;
        }

        .slide:nth-child(even) .polaroid {
            transform: rotate(2deg);
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.03);
        }

        .polaroid img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            border-radius: 2px;
            background: #f2d7dc;
        }

        .polaroid-caption {
            font-family: 'Great Vibes', cursive;
            color: #6b2737;
            font-size: 1.35rem;
            margin-top: 10px;
            line-height: 1;
        }

        /* Tipografi Surat */
        h1 {
            font-family: 'Great Vibes', cursive;
            color: #ffb3c1;
            font-size: 2.5rem;
            font-weight: normal;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(255, 77, 109, 0.3);
        }

        p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: #f8edeb;
            font-size: 1.18rem;
            line-height: 1.65;
            margin-bottom: 26px;
            min-height: 95px;
        }

        /* Navigasi */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 182, 193, 0.15);
            padding-top: 18px;
        }

        .btn-nav {
            background: linear-gradient(135deg, #ff4d6d, #c9184a);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(201, 24, 74, 0.4);
        }

        .btn-nav:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
        }

        .btn-nav:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Titik Indikator */
        .dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 179, 193, 0.3);
            transition: 0.4s;
        }

        .dot.active {
            background: #ff758f;
            width: 22px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ff758f;
        }

        /* Modal Kejutan Akhir */
        .final-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 4, 10, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            opacity: 0;
            visibility: hidden;
            transition: 0.6s ease;
            padding: 20px;
        }

        .final-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(145deg, #3b1327, #1f0914);
            border: 1px solid #ff8fa3;
            padding: 35px 25px;
            border-radius: 24px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 77, 109, 0.4);
        }

        .modal-content h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #ffccd5;
            margin-bottom: 15px;
        }

        .modal-content p {
            min-height: auto;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Partikel Cahaya Latar -->
    <div class="particles" id="particlesContainer"></div>

    <!-- Audio Latar (Opsional: taruh file lagu.mp3 di folder yang sama) -->
    <audio id="bgMusic" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>
    <button type="button" class="music-btn" id="musicToggle" onclick="toggleMusic()">🎵 Putar Musik</button>

    <!-- Layar Pembuka (Segel Amplop) -->
    <div class="envelope-screen" id="envelopeScreen">
        <div class="wax-seal" id="waxSeal" role="button" tabindex="0" aria-label="Buka Surat">❤️</div>
        <div class="envelope-title">Untuk Kamu, Semestaku</div>
        <div class="envelope-sub">Sentuh segel hati untuk membuka surat</div>
    </div>

    <!-- Kontainer Utama Surat -->
    <div class="card-container">
        
        <!-- ================= SLIDE 1 ================= -->
        <div class="slide active">
            <div class="polaroid">
                <img src="fahmi.jpeg" alt="Kenangan 1">
                <div class="polaroid-caption">Awal Cerita Kita</div>
            </div>
            <h1>Sejak Hadirmu...</h1>
            <p class="type-text" data-text="Dari sekian banyak kebetulan di dunia ini, bertemu dan mengenalmu adalah takdir terindah yang pernah aku syukuri setiap hari."></p>
        </div>

        <!-- ================= SLIDE 2 ================= -->
        <div class="slide">
            <div class="polaroid">
                <img src="fahmi2.jpeg" alt="Kenangan 2">
                <div class="polaroid-caption">Senyum Favoritku</div>
            </div>
            <h1>Tentang Kamu</h1>
            <p class="type-text" data-text="Aku selalu jatuh cinta pada cara kamu tertawa, cara kamu bercerita, dan bagaimana kehadiranmu selalu berhasil menenangkan riuhnya kepalaku."></p>
        </div>

        <!-- ================= SLIDE 3 ================= -->
        <div class="slide">
            <div class="polaroid">
                <img src="fahmi3.jpeg" alt="Kenangan 3">
                <div class="polaroid-caption">Rumah Paling Nyaman</div>
            </div>
            <h1>Terima Kasih</h1>
            <p class="type-text" data-text="Terima kasih sudah menggenggam tanganku saat langkahku terasa berat, dan tetap memilih tinggal bahkan di saat aku tidak sedang baik-baik saja."></p>
        </div>

        <!-- ================= SLIDE 4 ================= -->
        <div class="slide">
            <div class="polaroid">
                <img src="fahmi4.jpeg" alt="Kenangan 4">
                <div class="polaroid-caption">Selamanya Bersamamu</div>
            </div>
            <h1>Harapanku</h1>
            <p class="type-text" data-text="Jika waktu bisa diulang seribu kali, aku akan tetap memilihmu di setiap kehidupan. Tetaplah berjalan di sampingku, hari ini, esok, dan selamanya."></p>
        </div>

        <!-- Navigasi -->
        <div class="nav-buttons">
            <button type="button" class="btn-nav" id="prevBtn" onclick="changeSlide(-1)" disabled>← Sebelumnya</button>
            
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <button type="button" class="btn-nav" id="nextBtn" onclick="changeSlide(1)">Berikutnya →</button>
        </div>

    </div>

    <!-- Kejutan Akhir -->
    <div class="final-modal" id="finalModal">
        <div class="modal-content">
            <h2>I Love You ❤️</h2>
            <p>
                "Kamu bukan sekadar bagian dari hariku, kamu adalah alasan di balik setiap senyumku."
            </p>
            <button type="button" class="btn-nav" onclick="closeModal()">Peluk Jauh 🤗</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        let typingTimeout;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggle');
        const waxSeal = document.getElementById('waxSeal');
        let isPlaying = false;

        function openLetter() {
            const screen = document.getElementById('envelopeScreen');
            screen.classList.add('hidden');
            startTypewriter(slides[0].querySelector('.type-text'));

            if (music && music.querySelector('source').getAttribute('src')) {
                const playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        musicBtn.textContent = "⏸️ Jeda Musik";
                    }).catch(() => {
                        // Abaikan jika file musik belum tersedia
                    });
                }
            }
        }

        waxSeal.addEventListener('click', openLetter);
        waxSeal.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openLetter();
            }
        });

        function toggleMusic() {
            if (!music) return;
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = "🎵 Putar Musik";
                isPlaying = false;
            } else {
                music.play().then(() => {
                    musicBtn.textContent = "⏸️ Jeda Musik";
                    isPlaying = true;
                }).catch(() => {
                    alert("Pastikan file lagu.mp3 sudah ada di folder yang sama dengan index.html ya.");
                });
            }
        }

        function startTypewriter(element) {
            clearTimeout(typingTimeout);
            const fullText = element.getAttribute('data-text');
            element.textContent = '';
            let i = 0;

            function type() {
                if (i < fullText.length) {
                    element.textContent += fullText.charAt(i);
                    i++;
                    typingTimeout = setTimeout(type, 32);
                }
            }
            type();
        }

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');

            currentSlide += direction;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');

            startTypewriter(slides[currentSlide].querySelector('.type-text'));

            prevBtn.disabled = currentSlide === 0;

            if (currentSlide === slides.length - 1) {
                nextBtn.textContent = "Buka Pesan Akhir ❤️";
                nextBtn.onclick = showFinalSurprise;
            } else {
                nextBtn.textContent = "Berikutnya →";
                nextBtn.onclick = () => changeSlide(1);
            }
        }

        function showFinalSurprise() {
            document.getElementById('finalModal').classList.add('show');
            for (let i = 0; i < 30; i++) {
                setTimeout(createSingleHeart, i * 100);
            }
        }

        function closeModal() {
            document.getElementById('finalModal').classList.remove('show');
        }

        function createSingleHeart() {
            const heart = document.createElement('div');
            heart.innerText = ['❤️', '💖', '🌹', '✨'][Math.floor(Math.random() * 4)];
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-30px';
            heart.style.fontSize = (Math.random() * 18 + 16) + 'px';
            heart.style.zIndex = '10002';
            heart.style.transition = 'transform 3.5s linear, opacity 3.5s ease';
            document.body.appendChild(heart);

            requestAnimationFrame(() => {
                heart.style.transform = `translateY(110vh) rotate(${Math.random() * 360}deg)`;
                heart.style.opacity = '0';
            });

            setTimeout(() => heart.remove(), 3600);
        }

        function initParticles() {
            const container = document.getElementById('particlesContainer');
            for (let i = 0; i < 25; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                const size = Math.random() * 12 + 4 + 'px';
                sparkle.style.width = size;
                sparkle.style.height = size;
                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.animationDelay = Math.random() * 8 + 's';
                sparkle.style.animationDuration = (Math.random() * 6 + 7) + 's';
                container.appendChild(sparkle);
            }
        }

        initParticles();
    </script>
</body>
</html>
